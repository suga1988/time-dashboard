name: Update Toggl data

on:
  schedule:
    - cron: '0 20 * * *'   # 毎日 05:00 JST（UTC 20:00）。週1にするなら '0 20 * * 0'
  workflow_dispatch:        # Actionsタブから手動実行もできる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Toggl entries
        env:
          TOGGL_API_TOKEN: ${{ secrets.TOGGL_API_TOKEN }}
          START_DATE: '2026-09-01'
        run: python fetch_toggl.py
      - name: Commit data.json
        run: |
          git config user.name "toggl-bot"
          git config user.email "toggl-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "no change" || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
